name: macro-vintage-lakehouse

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_S3_ACCESS_KEY_ID:?copy .env.example to .env}
      AWS_SECRET_ACCESS_KEY: ${LAKE_S3_SECRET_ACCESS_KEY:?copy .env.example to .env}
      S3_BUCKET: ${LAKE_S3_BUCKET:?copy .env.example to .env}
    ports:
      - "127.0.0.1:8333:8333"    # S3 API
      - "127.0.0.1:23646:23646"  # admin UI
    volumes:
      - lake-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

volumes:
  lake-data:
