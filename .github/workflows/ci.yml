name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The lake settings CI uses. No FRED key: the models are built against
  # synthetic fixture data written by tools/make_fixture_lake.py.
  LAKE_S3_ENDPOINT: 127.0.0.1:8333
  LAKE_S3_REGION: us-east-1
  LAKE_S3_USE_SSL: "false"
  LAKE_S3_URL_STYLE: path
  LAKE_S3_BUCKET: lake
  LAKE_S3_ACCESS_KEY_ID: lake
  LAKE_S3_SECRET_ACCESS_KEY: ci-has-no-real-secret
  DBT_PROJECT_DIR: dbt
  DBT_PROFILES_DIR: dbt

jobs:
  tests:
    name: tests on python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Break the safeguards and check a test notices
        run: python tools/mutate.py --only pytest

  lakehouse:
    name: models against SeaweedFS
    runs-on: ubuntu-latest
    services:
      lake:
        image: chrislusf/seaweedfs:4.47
        ports:
          - 8333:8333
        env:
          AWS_ACCESS_KEY_ID: lake
          AWS_SECRET_ACCESS_KEY: ci-has-no-real-secret
          S3_BUCKET: lake
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8333/healthz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check the stack
        run: python -m macro_lake.check_stack
      - name: Fill bronze with fixture data
        run: python tools/make_fixture_lake.py
      - name: Build the models and run their tests
        run: dbt build
      - name: Break the model safeguards and check a test notices
        run: python tools/mutate.py --only dbt
      - name: Show what the models produced
        run: |
          python - <<'PY'
          from macro_lake.settings import load_lake_settings
          from macro_lake.storage import duckdb_connect

          settings = load_lake_settings()
          connection = duckdb_connect(settings)
          versions = connection.sql(f"select count(*) from '{settings.uri('silver/observation_versions.parquet')}'").fetchone()[0]
          print(f"silver versions: {versions}")
          for row in connection.sql(
              f"""
              select series_id, measure, observations, round(100 * share_revised, 1) as pct_revised,
                     round(median_abs_revision, 3) as median_abs_revision
              from '{settings.uri('gold/series_revision_summary.parquet')}'
              order by series_id
              """
          ).fetchall():
              print(row)
          PY
