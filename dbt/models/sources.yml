version: 2

sources:
  - name: bronze
    description: >
      Raw API responses written by `python -m macro_lake.ingest`: one
      content-addressed Parquet snapshot per series per vintage, with every
      source column kept as the string the API sent.
    config:
      loaded_at_field: _ingested_at
      freshness:
        warn_after: {count: 10, period: day}
        error_after: {count: 35, period: day}
    tables:
      - name: alfred_observations
        description: Every value each series has published, with the real-time period it was current.
        config:
          external_location: "read_parquet('s3://{{ env_var('LAKE_S3_BUCKET') }}/bronze/alfred/observations/*/*/*.parquet', hive_partitioning = true)"
      - name: alfred_vintage_dates
        description: Every date on which each series' values were revised or new values released.
        config:
          external_location: "read_parquet('s3://{{ env_var('LAKE_S3_BUCKET') }}/bronze/alfred/vintage_dates/*/*/*.parquet', hive_partitioning = true)"
      - name: fred_series
        description: FRED metadata for each series as of the snapshot.
        config:
          external_location: "read_parquet('s3://{{ env_var('LAKE_S3_BUCKET') }}/bronze/fred/series/*/*/*.parquet', hive_partitioning = true)"
